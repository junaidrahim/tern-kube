[package]
name = "tern-kube"
version = "0.1.0"
edition = "2024"
description = "A fast native Kubernetes GUI for Tern"
license = "MIT"
publish = false

[[bin]]
name = "tern-kube"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
http = "1"
jiff = "0.2"
k8s-openapi = { version = "0.29", features = ["v1_33"] }
kube = { version = "5", default-features = false, features = ["client", "runtime", "rustls-tls", "ring", "ws"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tern-sdk = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }

[profile.release]
lto = "thin"
codegen-units = 1
